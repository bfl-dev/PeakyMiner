[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peakyminer"
version = "0.1.0"
description = "Herramienta CLI para la detección automatizada de repositorios GitHub que utilizan GitHub Agentic Workflows (GH-AW)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PeakyMiner Team" }
]
keywords = ["github", "agentic-workflows", "gh-aw", "cli", "graphql", "mining"]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.1",
    "pyarrow>=14.0.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
pkminer = "src.cli:app"
miner = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008"]
